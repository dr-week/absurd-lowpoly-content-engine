name: Sync Live India Trends & News

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Sync Python deps
        run: uv sync

      - name: Fetch Google Trends India & News RSS
        run: uv run python scripts/sync_trends.py

      - name: Commit updated live_trends.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/live_trends.json
          git diff --cached --quiet || git commit -m "chore: refresh live India trends and keywords"
          git push
