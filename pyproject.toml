[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "absurd-lowpoly-content-engine"
version = "0.1.0"
description = "Backend script and prompt generation engine for 1998 PS1/N64 low-poly absurdist Hindi/Hinglish storyboards and 20s vertical videos."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
absurd = "absurd_engine.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/absurd_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
