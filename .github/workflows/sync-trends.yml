name: Sync Live India Trends & News

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Sync Python deps
        run: uv sync

      - name: Fetch Google Trends India & News RSS
        run: uv run python scripts/sync_trends.py

      - name: Generate Daily AI Episode Pool (if secret configured)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: uv run python scripts/generate_daily_pool.py

      - name: Commit updated live_trends.json and daily_episodes.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/live_trends.json
          [ -f web/public/daily_episodes.json ] && git add web/public/daily_episodes.json || true
          git diff --cached --quiet || git commit -m "chore: refresh live trends and daily AI episode pool"
          git push
